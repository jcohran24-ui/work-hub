<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030817">
<link rel="manifest" href="manifest.webmanifest">
<title>CTCC Manpower Tracker</title>
<style>
:root{
  --bg:#030817;
  --panel:#121b2d;
  --input:#202d41;
  --input-border:#3a4c66;
  --text:#f7f9fc;
  --muted:#7790b3;
  --yellow:#ffbf00;
  --yellow-border:#8f6f00;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.shell{
  width:100%;
  max-width:500px;
  margin:0 auto;
  padding:18px 16px 44px;
}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  margin:0 0 18px 16px;
}
.brand-icon{
  width:38px;height:38px;border-radius:12px;background:var(--yellow);
  display:grid;place-items:center;flex:0 0 auto;
}
.brand-icon svg{width:22px;height:22px;stroke:#101827}
.brand-copy .eyebrow{
  color:var(--yellow);
  font-weight:900;
  letter-spacing:.18em;
  font-size:12px;
  line-height:1;
  margin-bottom:5px;
}
.brand-copy h1{
  margin:0;
  color:#fff;
  font-size:17px;
  font-weight:800;
  line-height:1.1;
}
.card{
  background:var(--panel);
  border-radius:0;
  padding:22px 18px 20px;
}
.intro{
  margin:0 0 18px;
  font-size:14px;
  line-height:1.45;
  color:#f4f6fb;
}
.install{
  width:100%;
  height:42px;
  border-radius:9px;
  border:1px solid var(--yellow-border);
  background:#2a2d28;
  color:#ffd000;
  font-weight:800;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  margin-bottom:18px;
}
.install svg{width:17px;height:17px;stroke:#ffd000}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.field{min-width:0}
.field.full{grid-column:1/-1}
label{
  display:block;
  margin:0 0 7px;
  font-size:12px;
  font-weight:800;
  color:#fff;
}
.req{color:var(--yellow);padding-left:3px}
input,textarea{
  width:100%;
  border:1px solid var(--input-border);
  background:var(--input);
  color:#fff;
  outline:none;
  border-radius:9px;
  padding:0 11px;
  font:inherit;
  font-size:13px;
  transition:.12s ease;
}
input{height:42px}
textarea{
  min-height:82px;
  padding:12px 11px;
  resize:vertical;
}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input:focus,textarea:focus{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px rgba(255,191,0,.12);
}
input[type="number"]{appearance:auto}
.calc{
  margin:16px 0 18px;
  border:1px solid #6d5310;
  background:#2c2b25;
  border-radius:14px;
  min-height:64px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 13px;
}
.calc-label{
  font-size:12px;
  color:#fff;
  white-space:nowrap;
}
.calc-right{text-align:right}
.calc-total{
  color:var(--yellow);
  font-weight:900;
  font-size:18px;
  line-height:1.05;
}
.calc-detail{
  margin-top:7px;
  color:#89a4c6;
  font-size:10px;
}
.spacer{margin-top:14px}
.submit{
  width:100%;
  height:44px;
  border:0;
  border-radius:9px;
  background:var(--yellow);
  color:#101827;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  margin-top:16px;
}
.submit:hover{filter:brightness(1.04)}
.message{
  margin-top:13px;
  padding:11px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
  display:none;
}
.message.ok{display:block;background:#113622;color:#bdf5ce;border:1px solid #22623b}
.message.err{display:block;background:#3a171b;color:#ffd4d7;border:1px solid #7d2930}
.admin-link{
  display:block;
  text-align:center;
  color:#5b6d88;
  font-size:10px;
  text-decoration:none;
  margin-top:16px;
}
@media(max-width:560px){
  .shell{padding:14px 0 32px}
  .brand{margin-left:18px;margin-right:18px}
  .card{padding:20px 18px}
}
@media(max-width:390px){
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3 .field:last-child{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="shell">
  <header class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M4 15h16M6 15v-2a6 6 0 0 1 12 0v2M9 9V6.5M15 9V6.5M3.5 15v2h17v-2"/>
      </svg>
    </div>
    <div class="brand-copy">
      <div class="eyebrow">CTCC OASIS</div>
      <h1>Daily Manpower Check-In</h1>
    </div>
  </header>

  <section class="card">
    <p class="intro">Foremen: submit your final crew count and hours before leaving the jobsite.</p>

    <button type="button" class="install" id="installBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/>
      </svg>
      Install Daily Report App
    </button>

    <form id="reportForm">
      <div class="grid2">
        <div class="field">
          <label>Company / subcontractor <span class="req">*</span></label>
          <input name="company" placeholder="Precision Concrete" autocomplete="organization" maxlength="120" required>
        </div>
        <div class="field">
          <label>Foreman name <span class="req">*</span></label>
          <input name="foreman" placeholder="First and last name" autocomplete="name" maxlength="120" required>
        </div>

        <div class="field">
          <label>Work date <span class="req">*</span></label>
          <input name="work_date" type="date" required>
        </div>
        <div class="field">
          <label>Crew onsite <span class="req">*</span></label>
          <input name="crew_count" type="number" min="1" max="500" placeholder="0" required>
        </div>
      </div>

      <div class="grid3">
        <div class="field">
          <label>Start</label>
          <input name="start_time" type="time" value="07:00" required>
        </div>
        <div class="field">
          <label>Finish</label>
          <input name="end_time" type="time" value="17:30" required>
        </div>
        <div class="field">
          <label>Break (min)</label>
          <input name="break_minutes" type="number" min="0" max="720" value="30" required>
        </div>
      </div>

      <div class="calc">
        <div class="calc-label">Calculated total</div>
        <div class="calc-right">
          <div class="calc-total" id="calcTotal">0.0 manhours</div>
          <div class="calc-detail" id="calcDetail">10.0 hours × 0 workers</div>
        </div>
      </div>

      <div class="field spacer">
        <label>Work area <span class="req">*</span></label>
        <input name="work_area" placeholder="A2, A4, service drive..." maxlength="160" required>
      </div>

      <div class="field spacer">
        <label>Work performed <span class="req">*</span></label>
        <textarea name="activity" placeholder="Describe the work completed today" maxlength="300" required></textarea>
      </div>

      <div class="field spacer">
        <label>Notes (optional)</label>
        <textarea name="notes" placeholder="Delays, deliveries, safety or coordination notes" maxlength="1000"></textarea>
      </div>

      <button class="submit" type="submit">Submit Daily Report</button>
      <div id="message" class="message"></div>
    </form>

    <a class="admin-link" href="/dashboard/">Superintendent access</a>
  </section>
</main>

<script>
const SUPABASE_URL="https://nbigdhcvmhyjdvirfcgn.supabase.co";
const SUPABASE_KEY="sb_publishable_heHrE7pTbbnQk-klhkvqGg_3otOHPqE";
const TABLE="ctcc_manpower_entries";

const form=document.getElementById("reportForm");
const msg=document.getElementById("message");
const calcTotal=document.getElementById("calcTotal");
const calcDetail=document.getElementById("calcDetail");

function localDateValue(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
form.elements.work_date.value=localDateValue();

function calculation(){
  const crew=Number(form.elements.crew_count.value||0);
  const brk=Number(form.elements.break_minutes.value||0);
  const st=form.elements.start_time.value;
  const et=form.elements.end_time.value;
  if(!st||!et){
    calcTotal.textContent="0.0 manhours";
    calcDetail.textContent="0.0 hours × "+crew+" workers";
    return null;
  }
  const [sh,sm]=st.split(":").map(Number), [eh,em]=et.split(":").map(Number);
  let mins=(eh*60+em)-(sh*60+sm)-brk;
  if(mins<0) mins+=1440;
  mins=Math.max(0,Math.min(1440,mins));
  const hours=mins/60;
  const manhours=hours*crew;
  calcTotal.textContent=manhours.toFixed(1)+" manhours";
  calcDetail.textContent=hours.toFixed(1)+" hours × "+crew+" workers";
  return {mins,manMinutes:mins*crew};
}
["input","change"].forEach(evt=>form.addEventListener(evt,calculation));
calculation();

function showMessage(text,type){
  msg.className="message "+type;
  msg.textContent=text;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.className="message";
  msg.textContent="";
  const c=calculation();
  if(!c){showMessage("Please check the time and crew information.","err");return;}
  const payload={
    company:form.elements.company.value.trim(),
    foreman:form.elements.foreman.value.trim(),
    crew_count:Number(form.elements.crew_count.value),
    work_date:form.elements.work_date.value,
    start_time:form.elements.start_time.value,
    end_time:form.elements.end_time.value,
    break_minutes:Number(form.elements.break_minutes.value),
    total_minutes:c.mins,
    total_man_minutes:c.manMinutes,
    work_area:form.elements.work_area.value.trim(),
    activity:form.elements.activity.value.trim(),
    notes:form.elements.notes.value.trim()
  };
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/"+TABLE,{
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        Prefer:"return=minimal"
      },
      body:JSON.stringify(payload)
    });
    if(!r.ok){
      const t=await r.text();
      throw new Error(t||"Submission failed");
    }
    const company=payload.company,foreman=payload.foreman;
    form.reset();
    form.elements.company.value=company;
    form.elements.foreman.value=foreman;
    form.elements.work_date.value=localDateValue();
    form.elements.start_time.value="07:00";
    form.elements.end_time.value="17:30";
    form.elements.break_minutes.value="30";
    calculation();
    showMessage("Daily report submitted successfully.","ok");
  }catch(err){
    showMessage("Unable to submit report. Please try again.","err");
  }
});

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredPrompt=e;
});
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt=null;
  }else{
    alert("On your phone, use the browser menu and choose “Add to Home Screen” or “Install app.”");
  }
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
