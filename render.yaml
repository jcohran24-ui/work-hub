services:
  - type: web
    name: field-operations-hub
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SCHEDULE_URL
        sync: false
      - key: TIMESHEETS_URL
        sync: false
      - key: MANPOWER_URL
        sync: false
      - key: EQUIPMENT_URL
        sync: false
      - key: SPECIALTY_URL
        sync: false
      - key: INSPECTIONS_URL
        sync: false
      - key: SAFETY_URL
        sync: false
      - key: CONTACTS_URL
        sync: false
      - key: DOCUMENTS_URL
        sync: false
